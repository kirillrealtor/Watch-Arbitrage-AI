[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronoarb-adapters"
version = "0.1.0"
description = "ChronoArb source adapters — source-specific fetch and parse implementations"
requires-python = ">=3.13"
dependencies = [
    "chronoarb-domain",
]

[tool.hatch.build.targets.wheel]
packages = ["chronoarb"]
