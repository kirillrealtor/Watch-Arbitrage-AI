[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronoarb-api"
version = "0.1.0"
description = "ChronoArb customer-facing FastAPI modular monolith"
requires-python = ">=3.13"
dependencies = [
    "chronoarb-domain",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.18,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "asyncpg>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<1",
    "httpx>=0.28,<1",
    "ruff>=0.8,<1",
    "mypy>=2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["apps"]
